spring.application.name=insurance-ledger
spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${LEDGER_DB_USER:ledger}
spring.datasource.password=${LEDGER_DB_PASSWORD:ledger}
spring.flyway.enabled=true
spring.jackson.serialization.indent-output=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false
server.error.include-message=always
ledger.source-commit=${LEDGER_SOURCE_COMMIT:unknown}
